---
- name: Удаленный запуск сценариев админа с поддержкой DEB пакетов
  hosts: script_targets
  become: yes
  gather_facts: no

  tasks:
    # Шаг 1: Копируем DEB пакет, только если путь к нему был явно выбран в программе
    - name: Копирование указанного DEB-пакета на удаленные хосты
      ansible.builtin.copy:
        src: "{{ custom_deb_path }}"
        dest: "/tmp/{{ custom_deb_path | basename }}"
        mode: '0644'
      when: custom_deb_path | length > 0

    # Шаг 2: Передаем и выполняем ваш скрипт-скелет установки
    - name: Передача и выполнение скрипта на целевых ПК
      ansible.builtin.script:
        cmd: "{{ custom_script_path }}"
      register: script_output

    # Шаг 3: Выводим лог работы dpkg -i прямо в зеленый терминал панели
    - name: Отображение результатов выполнения скрипта в терминале
      ansible.builtin.debug:
        msg: "{{ script_output.stdout_lines }}"
      when: script_output.stdout_lines | length > 0
